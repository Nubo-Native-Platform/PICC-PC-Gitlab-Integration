# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=gitlab-int

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:main}

# GitLab Primary Feign Client Configuration
feign.name=${FEIGN_NAME:gitlab-client}
feign.url=${FEIGN_URL:https://gitlab.example.com}
feign.url.api=${FEIGN_URL_API:/api/v4}
feign.apiToken=${FEIGN_APITOKEN:}

# Secondary NNP GitLab Client Configuration
nnp.feign.name=${NNP_FEIGN_NAME:nnp-gitlab-client}
nnp.feign.url=${NNP_FEIGN_URL:https://gitlab.example.com}
nnp.feign.apiToken=${NNP_FEIGN_APITOKEN:}

# Hazelcast Configuration (Single-Node Loopback)
hazelcast.port=${HAZELCAST_PORT:5701}

# Cache Refresh Cron Expression (Default: Hourly)
cache.refresh.cron.expression=${CACHE_REFRESH_CRON:0 0 * * * *}
